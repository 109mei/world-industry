<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="description" content="%GAME_DESCRIPTION%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%GAME_TITLE%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- SNS やチャットに貼ったときに出るカード（サムネイルは public/og.jpg） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%GAME_TITLE%" />
    <meta property="og:title" content="%GAME_TITLE% — %GAME_TAGLINE%" />
    <meta property="og:description" content="%GAME_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%GAME_TITLE% — %GAME_TAGLINE%" />
    <meta name="twitter:description" content="%GAME_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%og.jpg" />

    <title>%GAME_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
